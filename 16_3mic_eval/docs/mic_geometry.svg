<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .mic { fill: #c0392b; }
    .lbl { fill: #222; }
    .dim { fill: #555; font-size: 12px; }
    .path { stroke-width: 2; fill: none; }
    .frame { stroke: #2c3e50; stroke-width: 4; fill: none; }
    .face { stroke: #bbb; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
  </style>

  <text x="20" y="30" font-size="20" font-weight="bold" class="lbl">Front view — wearer's face, mic array on the glasses</text>

  <!-- face outline -->
  <ellipse cx="300" cy="300" rx="190" ry="240" class="face"/>

  <!-- glasses frame -->
  <g class="frame">
    <ellipse cx="215" cy="235" rx="75" ry="52"/>
    <ellipse cx="385" cy="235" rx="75" ry="52"/>
    <path d="M290 230 Q300 215 310 230"/>          <!-- bridge -->
    <path d="M140 230 L112 222"/>                  <!-- left temple hinge -->
    <path d="M460 230 L488 222"/>                  <!-- right temple hinge -->
  </g>

  <!-- mouth -->
  <path d="M250 420 Q300 455 350 420" stroke="#c0392b" stroke-width="4" fill="none"/>
  <circle cx="300" cy="432" r="6" fill="#c0392b"/>
  <text x="365" y="440" class="lbl">mouth = sound source</text>

  <!-- paths from mouth to mics -->
  <line x1="300" y1="432" x2="300" y2="218" stroke="#2a7fbf" class="path"/>
  <line x1="300" y1="432" x2="115" y2="222" stroke="#e67e22" class="path"/>
  <line x1="300" y1="432" x2="485" y2="222" stroke="#e67e22" class="path"/>

  <!-- mics -->
  <circle cx="115" cy="222" r="9" class="mic"/>
  <circle cx="300" cy="218" r="9" class="mic"/>
  <circle cx="485" cy="222" r="9" class="mic"/>
  <text x="70" y="200" class="lbl" font-weight="bold">LEFT</text>
  <text x="258" y="196" class="lbl" font-weight="bold">CENTER</text>
  <text x="458" y="200" class="lbl" font-weight="bold">RIGHT</text>
  <text x="62" y="248" class="dim">temple hinge</text>
  <text x="268" y="176" class="dim">nose bridge</text>
  <text x="452" y="248" class="dim">temple hinge</text>

  <!-- distances -->
  <text x="308" y="330" fill="#2a7fbf" font-weight="bold">D ≈ 120 mm</text>
  <text x="150" y="345" fill="#e67e22" font-weight="bold">√(D² + d²) ≈ 139 mm</text>
  <text x="400" y="345" fill="#e67e22" font-weight="bold">≈ 139 mm</text>

  <!-- spacing d -->
  <line x1="115" y1="140" x2="300" y2="140" stroke="#555" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="300" y1="140" x2="485" y2="140" stroke="#555" stroke-width="1"/>
  <line x1="115" y1="132" x2="115" y2="148" stroke="#555"/>
  <line x1="300" y1="132" x2="300" y2="148" stroke="#555"/>
  <line x1="485" y1="132" x2="485" y2="148" stroke="#555"/>
  <text x="180" y="130" class="dim">d ≈ 70 mm</text>
  <text x="365" y="130" class="dim">d ≈ 70 mm</text>

  <!-- explanation box -->
  <g transform="translate(560, 60)">
    <rect x="0" y="0" width="400" height="200" rx="8" fill="#f7f9fb" stroke="#ccd"/>
    <text x="16" y="30" font-weight="bold" class="lbl">Why the centre mic hears the mouth first</text>
    <text x="16" y="60" class="lbl">extra path to each side mic</text>
    <text x="16" y="82" class="lbl">   = 139 − 120 ≈ 19 mm</text>
    <text x="16" y="110" class="lbl">at 343 m/s  →  ≈ 55 µs</text>
    <text x="16" y="132" class="lbl">at 16 kHz    →  ≈ 0.9 sample</text>
    <text x="16" y="164" class="lbl">Fix: hold the centre mic back 1 sample</text>
    <text x="16" y="186" class="lbl" font-family="Menlo, monospace" font-size="13">set_delay 0 1 0   (das_c1)</text>
  </g>

  <!-- top view -->
  <g transform="translate(560, 290)">
    <text x="0" y="0" font-size="16" font-weight="bold" class="lbl">Top view — why it only matters up close</text>
    <!-- array -->
    <line x1="40" y1="60" x2="360" y2="60" stroke="#2c3e50" stroke-width="3"/>
    <circle cx="40" cy="60" r="7" class="mic"/>
    <circle cx="200" cy="60" r="7" class="mic"/>
    <circle cx="360" cy="60" r="7" class="mic"/>
    <text x="28" y="48" class="dim">L</text>
    <text x="194" y="48" class="dim">C</text>
    <text x="354" y="48" class="dim">R</text>

    <!-- near source: curved wavefronts -->
    <circle cx="200" cy="150" r="6" fill="#c0392b"/>
    <text x="212" y="155" class="dim">mouth, ~12 cm away</text>
    <path d="M110 108 A95 95 0 0 1 290 108" stroke="#e67e22" stroke-width="2" fill="none"/>
    <path d="M60 128 A150 150 0 0 1 340 128" stroke="#e67e22" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
    <text x="30" y="100" fill="#e67e22" class="dim">curved wavefront:</text>
    <text x="30" y="114" fill="#e67e22" class="dim">reaches C before L and R</text>

    <!-- far source: flat wavefront -->
    <line x1="20" y1="215" x2="380" y2="215" stroke="#2a7fbf" stroke-width="2"/>
    <line x1="20" y1="232" x2="380" y2="232" stroke="#2a7fbf" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="30" y="258" fill="#2a7fbf" class="dim">flat wavefront from a speaker 60 cm+ away:</text>
    <text x="30" y="272" fill="#2a7fbf" class="dim">reaches all three at the same time → delays 0 0 0</text>
  </g>

  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="1" fill="#555"/></marker>
  </defs>
</svg>
