# --- Audio capture (TDM, three ICS-52000 microphones) ---
CONFIG_I2S=y

# --- Telemetry link: USB high-speed, CDC ACM. The stack initialises and
#     enables itself at boot; the class exposes the interrupt-driven UART API
#     that telemetry_transport.c drains its ring through. ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="iLAB"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="3-mic beamforming eval"
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# --- Debug console and Zephyr logs stay on uart20 (J-Link VCOM, 115200) ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Threads ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# --- Buttons / LEDs (BTN1 start, BTN2 stop, LED1 run, LED2 host connected) ---
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y

# ring buffers larger than 32 KiB need this
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y

# --- Evaluation defaults ---
CONFIG_EVAL_DEFAULT_DURATION_S=20
