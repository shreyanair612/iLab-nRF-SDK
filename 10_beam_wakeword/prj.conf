# nRF Edge AI
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=6700
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# Peripherals
CONFIG_GPIO=y
CONFIG_I2S=y

# Logging / console
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_ASSERT=y
CONFIG_UART_ASYNC_API=y
CONFIG_MAIN_STACK_SIZE=4096

# Wakeword app config
CONFIG_WW_PROBABILITY_THRESHOLD=700
CONFIG_WW_HISTORY_SIZE=6
CONFIG_WW_COUNT_THRESHOLD=4