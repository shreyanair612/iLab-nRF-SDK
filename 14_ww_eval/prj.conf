# --- Audio capture (I2S/TDM, two INMP441 microphones) ---
CONFIG_I2S=y

# --- Serial telemetry link (uart20 = J-Link VCOM). Baud is set in the board
#     overlay. The link carries framed binary packets; Zephyr logging is routed
#     through the same framing by a custom backend (see telemetry_transport.c),
#     so the plain UART console and UART log backend are disabled on purpose.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_OUTPUT=y
CONFIG_CRC=y

# --- Threads ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_STACK_INFO=y

# --- Buttons / LEDs (BTN1 start, BTN2 stop, LED1 run, LED2 detection) ---
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y

# --- nRF Edge AI wake-word runtime (same as 13_finalProto) ---
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=7000
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0
CONFIG_NRF_SYS_EVENT=y

# --- Wake-word post-processing, identical for every path ---
CONFIG_WW_PROBABILITY_THRESHOLD=700
CONFIG_WW_HISTORY_SIZE=6
CONFIG_WW_COUNT_THRESHOLD=4
CONFIG_WW_COOLDOWN_MS=1200

# --- Evaluation defaults ---
CONFIG_EVAL_DEFAULT_PRESET="raw_vs_bf_lr"
CONFIG_EVAL_DEFAULT_LIVE_PATH=3
CONFIG_EVAL_DEFAULT_DURATION_S=30

# ring buffers larger than 32 KiB need this
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y
